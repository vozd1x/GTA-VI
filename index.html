<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTA VI — Официальный лаунчер</title>
  <style>
    :root {
      --bg-base: #0b0a14;
      --bg-surface: rgba(20, 18, 34, 0.86);
      --bg-elevated: rgba(255, 255, 255, 0.035);
      --border-soft: rgba(255, 255, 255, 0.08);
      --accent-rose: #f25287;
      --accent-violet: #8b5cf6;
      --accent-mint: #38d9a9;
      --text-primary: #ece9f8;
      --text-secondary: #9c95b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text-primary);
      background:
        radial-gradient(circle at 18% 18%, rgba(242, 82, 135, 0.14), transparent 42%),
        radial-gradient(circle at 82% 22%, rgba(56, 217, 169, 0.1), transparent 44%),
        radial-gradient(circle at 50% 88%, rgba(139, 92, 246, 0.15), transparent 50%),
        var(--bg-base);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      line-height: 1.55;
    }

    .launcher {
      width: 100%;
      max-width: 740px;
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: 26px;
      padding: 40px 32px;
      box-shadow: 0 28px 75px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-mint);
      background: rgba(56, 217, 169, 0.08);
      border: 1px solid rgba(56, 217, 169, 0.22);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-mint);
      box-shadow: 0 0 8px rgba(56, 217, 169, 0.7);
    }

    .build-tag {
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(2.4rem, 6.5vw, 3.8rem);
      font-weight: 850;
      letter-spacing: 0.04em;
      line-height: 1.08;
      background: linear-gradient(100deg, #ff7aa8, var(--accent-violet), var(--accent-mint));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 14px;
    }

    .description {
      max-width: 530px;
      margin: 0 auto;
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-bottom: 22px;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.98rem;
      font-weight: 650;
      padding: 14px 26px;
      border-radius: 15px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.18s ease, box-shadow 0.22s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-download {
      color: #ffffff;
      background: linear-gradient(135deg, var(--accent-rose), var(--accent-violet));
      box-shadow: 0 12px 28px rgba(139, 92, 246, 0.28);
    }

    .btn-download:hover {
      box-shadow: 0 16px 34px rgba(242, 82, 135, 0.34);
    }

    .btn-ghost {
      color: var(--text-primary);
      background: var(--bg-elevated);
      border: 1px solid var(--border-soft);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.16);
    }

    .notice {
      display: none;
      margin-bottom: 24px;
      padding: 14px 18px;
      border-radius: 15px;
      font-size: 0.92rem;
      color: var(--text-primary);
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.28);
      text-align: center;
    }

    .specs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
    }

    .spec-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      padding: 16px 18px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .spec-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
    }

    .spec-label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .spec-value {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    @media (max-width: 520px) {
      .launcher {
        padding: 28px 20px;
        border-radius: 20px;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="launcher">
    <div class="top-bar">
      <div class="pill">
        <span class="dot"></span>
        <span>Пакет готов к загрузке</span>
      </div>
      <div class="build-tag">Client Build • Windows x64</div>
    </div>

    <section class="hero">
      <h1>GTA VI</h1>
      <p class="description">
        Установочный файл подготовлен для запуска на ПК. Нажми кнопку загрузки, чтобы сохранить установщик и проверить клиент.
      </p>
    </section>

    <div class="actions">
      <a class="btn btn-download" href="GTA_VI_Setup.exe" download="GTA_VI_Setup.exe" onclick="showNotice('download')">
        <span>⬇</span>
        <span>Скачать GTA_VI_Setup.exe</span>
      </a>
      <button class="btn btn-ghost" type="button" onclick="showNotice('help')">
        <span>Как запустить</span>
      </button>
    </div>

    <div id="noticeBox" class="notice"></div>

    <section class="specs" aria-label="Параметры файла">
      <div class="spec-card">
        <span class="spec-label">Файл установки</span>
        <span class="spec-value">GTA_VI_Setup.exe</span>
      </div>
      <div class="spec-card">
        <span class="spec-label">Система</span>
        <span class="spec-value">Windows 10 / 11</span>
      </div>
      <div class="spec-card">
        <span class="spec-label">Режим запуска</span>
        <span class="spec-value">Standalone Launcher</span>
      </div>
    </section>
  </main>

  <script>
    function showNotice(mode) {
      const box = document.getElementById("noticeBox");
      if (mode === "download") {
        box.innerHTML =
          "Загрузка <strong>GTA_VI_Setup.exe</strong> началась. Если скачивание не пошло, проверь, что файл лежит в одной папке с <code>index.html</code>.";
      } else {
        box.innerHTML =
          "После скачивания открой <strong>GTA_VI_Setup.exe</strong> двойным кликом. Если браузер или Windows спросят подтверждение запуска — разреши действие.";
      }
      box.style.display = "block";
    }
  </script>
</body>
</html>
